name: Build Hoopreel Windows alpha v0.13.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packager
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0 pywebview==6.2.1

      - name: Run tests
        run: python -m unittest discover -v

      - name: Check frontend behavior
        run: node tests/test_frontend.cjs

      - name: Build single-file launcher
        shell: cmd
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Hoopreel-v0.13.0-Alpha
          --icon web/static/app-icon.ico
          --paths "."
          --collect-submodules nba_roulette
          --collect-all webview
          --add-data "data/game;data/game"
          --add-data "data/goat/award_jackpot.json;data/goat"
          --add-data "data/goat/prehistoric_jackpot.json;data/goat"
          --add-data "web/static;web/static"
          scripts/run_desktop.py

      - name: Smoke-test native app window
        run: python scripts/check_desktop_build.py dist/Hoopreel-v0.13.0-Alpha.exe

      - name: Add tester instructions
        shell: pwsh
        run: Copy-Item docs/EXTERNAL_ALPHA_V0_13_0.md dist/README.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Hoopreel-v0.13.0-Alpha-Windows
          path: |
            dist/Hoopreel-v0.13.0-Alpha.exe
            dist/README.txt
          if-no-files-found: error

      - name: Upload native window QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-window-qa-Windows
          path: desktop-smoke.json
          if-no-files-found: warn
