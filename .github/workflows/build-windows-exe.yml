name: Build Hoop Roulette Windows alpha v0.14.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/run_desktop.py"
      - "scripts/check_desktop_build.py"
      - "scripts/scan_windows_package.ps1"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packager
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.3 pywebview==6.2.1

      - name: Run tests
        run: python -m unittest discover -v

      - name: Check frontend behavior
        run: node tests/test_frontend.cjs

      - name: Build portable app folder
        shell: cmd
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed --noupx
          --name HoopRoulette-v0.14.2-Alpha
          --icon web/static/app-icon.ico
          --paths "."
          --collect-submodules nba_roulette
          --collect-all webview
          --add-data "data/game;data/game"
          --add-data "data/goat/award_jackpot.json;data/goat"
          --add-data "data/goat/prehistoric_jackpot.json;data/goat"
          --add-data "web/static;web/static"
          --add-data "scripts/desktop_layout_qa.js;scripts"
          scripts/run_desktop.py

      - name: Scan portable app with Microsoft Defender
        shell: pwsh
        run: ./scripts/scan_windows_package.ps1 -PackagePath dist/HoopRoulette-v0.14.2-Alpha

      - name: Smoke-test native app window
        run: python scripts/check_desktop_build.py dist/HoopRoulette-v0.14.2-Alpha/HoopRoulette-v0.14.2-Alpha.exe

      - name: Add tester instructions
        shell: pwsh
        run: Copy-Item docs/EXTERNAL_ALPHA_V0_14_2_WINDOWS.md dist/HoopRoulette-v0.14.2-Alpha/README.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: HoopRoulette-v0.14.2-Alpha-Windows-Portable
          path: |
            dist/HoopRoulette-v0.14.2-Alpha/
            dist/HoopRoulette-v0.14.2-Alpha/README.txt
          if-no-files-found: error

      - name: Upload native window QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-window-qa-Windows
          path: |
            windows-scan.json
            windows-scan.txt
            desktop-smoke.json
            desktop-layout.png
          if-no-files-found: warn
