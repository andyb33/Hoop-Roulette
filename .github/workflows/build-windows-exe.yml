name: Build Hoop Roulette Windows alpha v0.15.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/run_desktop.py"
      - "scripts/check_desktop_build.py"
      - "scripts/scan_windows_package.ps1"
      - "scripts/check_windows_installer.ps1"
      - "packaging/windows.iss"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packager
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.3 pywebview==6.2.1

      - name: Run tests
        run: python -m unittest discover -v

      - name: Check frontend behavior
        run: node tests/test_frontend.cjs

      - name: Build app payload
        shell: cmd
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed --noupx
          --name HoopRoulette
          --icon web/static/app-icon.ico
          --paths "."
          --collect-submodules nba_roulette
          --collect-all webview
          --add-data "data/game;data/game"
          --add-data "data/goat/award_jackpot.json;data/goat"
          --add-data "data/goat/prehistoric_jackpot.json;data/goat"
          --add-data "web/static;web/static"
          --add-data "scripts/desktop_layout_qa.js;scripts"
          scripts/run_desktop.py

      - name: Add instructions
        shell: pwsh
        run: Copy-Item docs/EXTERNAL_ALPHA_V0_15_0.md dist/HoopRoulette/README.txt

      - name: Compile installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          }
          & $compiler packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }

      - name: Scan payload and installer with Microsoft Defender
        shell: pwsh
        run: ./scripts/scan_windows_package.ps1 -PackagePath dist

      - name: Test marked-download installer in Korean path
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/check_windows_installer.ps1

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: HoopRoulette-v0.15.0-Windows-Installer
          path: dist/installer/HoopRoulette-v0.15.0-Setup.exe
          if-no-files-found: error

      - name: Upload native window QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-window-qa-Windows
          path: |
            installer-test.json
            installer-test.log
            windows-scan.json
            windows-scan.txt
            desktop-smoke.json
            desktop-layout.png
          if-no-files-found: warn
