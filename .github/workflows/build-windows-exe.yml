name: Build Hoopreel Windows alpha v0.8

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "prototype-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packager
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0

      - name: Run tests
        run: python -m unittest discover -v

      - name: Build single-file launcher
        shell: cmd
        run: >-
          pyinstaller --noconfirm --clean --onefile
          --name Hoopreel-v0.8-Alpha
          --icon web/static/app-icon.ico
          --paths "."
          --collect-submodules nba_roulette
          --add-data "data/game;data/game"
          --add-data "data/goat/award_jackpot.json;data/goat"
          --add-data "data/goat/prehistoric_jackpot.json;data/goat"
          --add-data "web/static;web/static"
          scripts/run_web.py

      - name: Smoke-test packaged launcher
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/Hoopreel-v0.8-Alpha.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--no-open-browser", "--port", "38117" -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Milliseconds 500
              try {
                $state = Invoke-RestMethod -Uri "http://127.0.0.1:38117/api/state"
                if ($state.turn -eq 1 -and $state.turns_total -eq 14 -and $state.goat_enabled) {
                  $page = Invoke-WebRequest -Uri "http://127.0.0.1:38117/" -UseBasicParsing
                  if ($page.Content -notmatch 'reel-window') {
                    throw "Packaged launcher is missing the v0.8 roulette UI."
                  }
                  $ready = $true
                  break
                }
              } catch {
                if ($process.HasExited) {
                  throw "Packaged launcher exited before serving the game. Exit code: $($process.ExitCode)"
                }
              }
            }
            if (-not $ready) {
              throw "Packaged launcher did not become ready within 15 seconds."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Add tester instructions
        shell: pwsh
        run: Copy-Item docs/EXTERNAL_ALPHA_V0_8.md dist/README.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Hoopreel-v0.8-Alpha-Windows
          path: |
            dist/Hoopreel-v0.8-Alpha.exe
            dist/README.txt
          if-no-files-found: error
