name: Build Hoop Roulette Mac alpha v0.14.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/run_desktop.py"
      - "scripts/check_desktop_build.py"
      - ".github/workflows/build-mac-app.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Apple Silicon runner
        run: python -c 'import platform; assert platform.machine() == "arm64", platform.machine()'

      - name: Install packager
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0 pywebview==6.2.1

      - name: Run tests
        run: python -m unittest discover -v

      - name: Check frontend behavior
        run: node tests/test_frontend.cjs

      - name: Build Mac app
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir \
            --name HoopRoulette-v0.14.1-Alpha \
            --target-arch arm64 \
            --icon web/static/app-icon.icns \
            --osx-bundle-identifier com.andyb33.hooproulette \
            --paths . \
            --collect-submodules nba_roulette \
            --collect-all webview \
            --add-data "data/game:data/game" \
            --add-data "data/goat/award_jackpot.json:data/goat" \
            --add-data "data/goat/prehistoric_jackpot.json:data/goat" \
            --add-data "web/static:web/static" \
            --add-data "scripts/desktop_layout_qa.js:scripts" \
            scripts/run_desktop.py

      - name: Smoke-test native app window
        run: python scripts/check_desktop_build.py dist/HoopRoulette-v0.14.1-Alpha.app/Contents/MacOS/HoopRoulette-v0.14.1-Alpha

      - name: Package app and instructions
        run: |
          cp docs/EXTERNAL_ALPHA_V0_14_1.md dist/README.txt
          cd dist
          zip -q -r HoopRoulette-v0.14.1-Alpha-Mac-Apple-Silicon.zip HoopRoulette-v0.14.1-Alpha.app README.txt

      - name: Upload Mac build
        uses: actions/upload-artifact@v4
        with:
          name: HoopRoulette-v0.14.1-Alpha-Mac-Apple-Silicon
          path: dist/HoopRoulette-v0.14.1-Alpha-Mac-Apple-Silicon.zip
          if-no-files-found: error

      - name: Upload native window QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-window-qa-Mac
          path: |
            desktop-smoke.json
            desktop-layout.png
          if-no-files-found: warn
